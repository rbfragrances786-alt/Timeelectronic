backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

publish_mode: simple

collections:
  - name: "ac"
    label: "Air Conditioners"
    folder: "data/products/air-conditioners"
    create: true
    slug: "{{fields.id}}"
    extension: "json"
    format: "json"
    summary: "{{fields.title}} — Rs {{fields.cashPrice}}"
    fields:
      - label: "Product ID (unique, no spaces, e.g. ac-05)"
        name: "id"
        widget: "string"
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Category"
        name: "category"
        widget: "hidden"
        default: "Air Conditioners"
      - label: "Brand"
        name: "brand"
        widget: "select"
        options:
                  - "HAIER"
                  - "PEL"
                  - "DAWLANCE"
                  - "HP"
                  - "INFINIX"
                  - "SAMSUNG"
                  - "TCL"
                  - "ORIENT"
        allow_custom: true
      - label: "Cash Price (Rs) — current / sale price"
        name: "cashPrice"
        widget: "number"
        value_type: "int"
      - label: "Original Price (Rs) — crossed-out price, same as Cash Price if no discount"
        name: "originalPrice"
        widget: "number"
        value_type: "int"
      - label: "Product Image"
        name: "image"
        widget: "image"
        allow_multiple: false
      - label: "Specs / Features (one per line)"
        name: "specs"
        widget: "list"
        field: { label: "Spec", name: "spec", widget: "string" }
      - label: "Warranty Text"
        name: "warranty"
        widget: "string"
        required: false

